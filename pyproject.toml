[project]
name = "baffin-gallery"
version = "0.1.1"
description = "Point it at a folder of camera originals; get a chronological static gallery you can share as a link."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Chris Gough", email = "chris.gough@gosource.com.au" }]

# GPL-3.0-only, not -or-later. The repository carries the plain GPLv3 text and
# grants no "or any later version" anywhere, and GPLv3 without that statement is
# version 3 alone. Widening it later is a one-word change; narrowing it after
# people have relied on it is not, so the narrower reading is the honest one to
# publish. Change to GPL-3.0-or-later if that was the intent.
#
# Declared as an SPDX expression (PEP 639) rather than a License:: classifier,
# which that PEP deprecates. license-files ships the licence text in the
# distribution, which the GPL requires you to convey with the work.
license = "GPL-3.0-only"
license-files = ["LICENSE"]
# Runtime dependencies are added per-adapter in later phases; the domain is
# framework-free (stdlib only).
dependencies = [
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyexiv2>=2.16.0",
    "pyvips>=3.1.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.1",
    "watchfiles>=1.2.0",
    "xxhash>=3.8.1",
]

[project.scripts]
baffin = "baffin.interface.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Distribution is "baffin-gallery"; the importable package is "baffin".
packages = ["baffin"]
# Ship the Jinja templates and static assets (non-.py package data).
artifacts = [
    "baffin/adapters/render/templates/*.j2",
    "baffin/adapters/render/static/*",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "import-linter",
]
docs = [
    "furo>=2025.12.19",
    "sphinx>=9.1.0",
    "sphinx-autoapi>=3.8.0",
    "sphinxcontrib-plantuml>=0.31",
]
e2e = [
    "pytest-playwright>=0.5",
]

[tool.ruff]
line-length = 88
target-version = "py312"
# Spec/docs carry intentionally aligned example code; don't reformat them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Port error names are fixed by SPEC §5 (SourceUnreadable, DerivativeFailed, …);
# the N818 "Error suffix" convention doesn't apply.
"baffin/application/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["baffin"]
warn_unused_configs = true

# Third-party adapters without type stubs.
[[tool.mypy.overrides]]
module = ["xxhash", "pyexiv2", "pyvips", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "manual: excluded from the default gate; run explicitly",
    "wip: work in progress; excluded from the default gate",
    "browser: end-to-end browser tests (Playwright); excluded from the default gate",
]

[tool.importlinter]
root_package = "baffin"

[[tool.importlinter.contracts]]
name = "Clean architecture layers"
type = "layers"
layers = [
    "baffin.interface",
    "baffin.adapters",
    "baffin.application",
    "baffin.domain",
]

[[tool.importlinter.contracts]]
name = "Delivery-agnostic core"
type = "forbidden"
source_modules = [
    "baffin.application",
    "baffin.domain",
]
forbidden_modules = [
    "baffin.interface.cli",
    "baffin.interface.web",
]

[[tool.importlinter.contracts]]
name = "Test doubles stay out of production"
type = "forbidden"
source_modules = [
    "baffin.domain",
    "baffin.application",
    "baffin.adapters",
    "baffin.interface",
]
forbidden_modules = ["baffin.testing"]
